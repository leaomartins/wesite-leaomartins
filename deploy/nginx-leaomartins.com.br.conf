# leaomartins.com.br

# HTTP -> HTTPS. O desafio ACME fica fora do redirect: o certbot deste
# dominio usa o autenticador nginx, e a renovacao nao pode depender do 301.
server {
    listen 80;
    listen [::]:80;
    server_name leaomartins.com.br www.leaomartins.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/leaomartins;
    }

    location / {
        return 301 https://leaomartins.com.br$request_uri;
    }
}

# www -> sem www, para nao servir o mesmo conteudo em dois hosts
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.leaomartins.com.br;

    ssl_certificate /etc/letsencrypt/live/leaomartins.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/leaomartins.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://leaomartins.com.br$request_uri;
}

# host canonico
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name leaomartins.com.br;

    root /var/www/leaomartins;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/leaomartins.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/leaomartins.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # gzip on ja vem do nginx.conf, mas o gzip_types padrao so cobre text/html
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 512;
    gzip_vary on;

    # add_header nao e herdado por location que tenha o seu proprio,
    # por isso os cabecalhos de seguranca se repetem abaixo.
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # O deploy troca o index.html no lugar: revalidar sempre.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
